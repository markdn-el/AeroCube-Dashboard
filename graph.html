<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroCube | Analytics</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="mobile-top-bar">
    <button class="menu-toggle-btn" id="menuToggle"><i data-lucide="menu"></i></button>
    <span class="mobile-brand">AeroCube</span>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top-group">
      <div class="sidebar-logo">
        <img src="logo/aerocube logo.png" alt="AeroCube Logo" onerror="this.style.display='none'">
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item"><i data-lucide="layout-grid"></i><span>Dashboard</span></a>
        <a href="graph.html" class="nav-item active"><i data-lucide="line-chart"></i><span>Analytics</span></a>
        <a href="History.html" class="nav-item"><i data-lucide="clock"></i><span>History</span></a>
        <a href="aeroplug.html" class="nav-item"><i data-lucide="plug"></i><span>AeroPlug</span></a>
        <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span>Settings</span></a>
        <a href="maintenance.html" class="nav-item"><i data-lucide="wrench"></i><span>Maintenance</span></a>
      </div>
    </div>
    <div class="sidebar-footer">
      <a href="about.html" class="nav-item"><i data-lucide="help-circle"></i><span>About</span></a>
      <a href="#" id="btn-logout" class="nav-item logout-link"><i data-lucide="log-out"></i><span>Logout</span></a>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <div class="header-title">
        <h1>Analytics</h1>
        <p class="header-subtitle">Historical sensor data visualization</p>
      </div>
      <div class="header-badges">
        <div class="badge badge-live"><div class="badge-dot"></div>LIVE SYNC</div>
      </div>
    </header>

    <!-- Chart Selector + Time Range -->
    <section class="aeroplug-section">
      <div class="section-header">
        <h2><i data-lucide="line-chart"></i> Trend Analysis</h2>
        <div class="chart-controls">
          <select id="chart-selector" class="chart-select">
            <option value="co2">CO₂</option>
            <option value="pm25">PM 2.5</option>
            <option value="pm10">PM 10</option>
            <option value="pmaqi">PM AQI</option>
            <option value="voc">VOC Index</option>
            <option value="temp">Temperature</option>
            <option value="humidity">Humidity</option>
          </select>
          <div class="mode-toggle-group">
            <button class="mode-btn active" data-range="today">TODAY</button>
            <button class="mode-btn" data-range="7d">7 DAYS</button>
            <button class="mode-btn" data-range="30d">30 DAYS</button>
          </div>
        </div>
      </div>
      <div class="chart-wrapper">
        <canvas id="main-chart"></canvas>
      </div>
      <div class="chart-empty" id="chart-empty" style="display: none;">
        <i data-lucide="bar-chart-3"></i>
        <p>Not enough historical data available for this time range.</p>
      </div>
    </section>
  </main>

  <script>lucide.createIcons();</script>
  <script type="module" src="graph.js"></script>
</body>
</html>
